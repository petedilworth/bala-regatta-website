<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
     aria-label="Placeholder standing in for a scanned newspaper clipping">
  <rect width="520" height="360" fill="#fbf9f4"/>
  <rect x="0.5" y="0.5" width="519" height="359" fill="none" stroke="#d9d0bf"/>
  <g fill="#10242e" font-family="Georgia, serif">
    <text x="32" y="58" font-size="21">Regatta Draws Record Crowd</text>
    <text x="32" y="84" font-size="12" fill="#3d5561">SAMPLE CLIPPING — replace with a real scan</text>
  </g>
  <line x1="32" y1="100" x2="488" y2="100" stroke="#10242e"/>
  <g stroke="#cfc6b4" stroke-width="7" stroke-linecap="round">
    <line x1="36" y1="130" x2="250" y2="130"/><line x1="36" y1="150" x2="250" y2="150"/>
    <line x1="36" y1="170" x2="250" y2="170"/><line x1="36" y1="190" x2="215" y2="190"/>
    <line x1="36" y1="222" x2="250" y2="222"/><line x1="36" y1="242" x2="250" y2="242"/>
    <line x1="36" y1="262" x2="190" y2="262"/>
    <line x1="278" y1="130" x2="484" y2="130"/><line x1="278" y1="150" x2="484" y2="150"/>
    <line x1="278" y1="170" x2="484" y2="170"/><line x1="278" y1="190" x2="440" y2="190"/>
    <line x1="278" y1="222" x2="484" y2="222"/><line x1="278" y1="242" x2="410" y2="242"/>
  </g>
  <text x="32" y="316" font-size="12" font-family="system-ui, sans-serif" fill="#8a99a1">
    public/archives/&lt;year&gt;/clipping.jpg
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img"
     aria-label="Placeholder standing in for a scanned regatta programme">
  <rect width="400" height="540" fill="#f2ece0"/>
  <rect x="0.5" y="0.5" width="399" height="539" fill="none" stroke="#d9d0bf"/>
  <g fill="#0e3140" font-family="Georgia, serif" text-anchor="middle">
    <text x="200" y="120" font-size="19" letter-spacing="3">BALA REGATTA</text>
    <text x="200" y="160" font-size="13" fill="#3d5561">OFFICIAL PROGRAMME</text>
  </g>
  <line x1="90" y1="185" x2="310" y2="185" stroke="#b0402a" stroke-width="2"/>
  <g fill="#8a99a1" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="200" y="290" font-size="15">Placeholder image</text>
    <text x="200" y="315" font-size="12">Replace with a scan of the real programme</text>
    <text x="200" y="340" font-size="12">public/archives/&lt;year&gt;/</text>
  </g>
  <g stroke="#d9d0bf" stroke-width="1">
    <line x1="70" y1="400" x2="330" y2="400"/>
    <line x1="70" y1="424" x2="330" y2="424"/>
    <line x1="70" y1="448" x2="290" y2="448"/>
  </g>
</svg>

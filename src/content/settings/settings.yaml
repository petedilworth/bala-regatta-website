- id: site
  # The regatta is held on the Saturday of the August long weekend, so the date is
  # never typed here — it is computed at build time (src/lib/regatta-date.ts) and the
  # site is rebuilt weekly so it cannot go stale. Only the edition is anchored:
  # the 115th regatta was in 2026. Bump this only if a year is ever skipped.
  editionAnchor:
    year: 2026
    edition: 115
  # Unused while the site has no Register page — kept so one can return without
  # retyping. TODO: replace with the real Google Form / Jotform URL before launch.
  registrationUrl: https://example.com/replace-with-registration-form
  registrationNote: >-
    Registration opens on the morning of the regatta at the Township Dock.
    Sign-up sheets for each event close fifteen minutes before that event starts.
  email: balaregatta@gmail.com
  # TODO: add the real social links, or delete these lines.
  # facebook: https://www.facebook.com/...
  # instagram: https://www.instagram.com/...

  # The curated strip at the top of /archives. Hand-picked, so it needs a look
  # once a year or it will read as stale.
  featured:
    # Check a curated link actually returns rows before shipping it. The strip is
    # hand-maintained and drifts: a previous card here promised 1950s photographs
    # while the archive held none from that decade.
    - label: The earliest photographs
      blurb: >-
        Postcards and prints from 1911 and 1913 — the skiff race, gunnel bobbing,
        and crowds watching from the north shore.
      href: /archives?decade=1910s
    - label: The trophies
      blurb: Eighteen cups and awards, and everyone the programmes record as winning them since 1989.
      href: /archives/trophies
    - label: The committees, 1975-2026
      blurb: >-
        Commodores from 1975 to 2026, and the officers who served alongside them,
        reconstructed from the programmes.
      href: /archives/officers
    - label: Programmes and results sheets
      blurb: Scanned programmes, prize lists and official results as they were printed.
      href: /archives/gallery

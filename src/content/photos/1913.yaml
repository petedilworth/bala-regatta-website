year: 1913
items:
  - file: /archives/1913/1913-postcard-cpr-station.jpg
    caption: >-
      "Bala at C.P.R. Station, Muskoka Lakes, Canada" — hand-tinted postcard looking
      from the north shore back toward the station, steamships picking up passengers,
      a skiff race underway.
    credit: John Boyd fonds
    event: skiff-race
  - file: /archives/1913/1913-boyd-fonds-print.jpg
    caption: >-
      The same scene, from the original black-and-white print: "Canoe Regatta, in
      Bala, Muskoka, 1913."
    credit: John Boyd fonds
    event: skiff-race
  - file: /archives/1913/1913-postcard-at-bala.jpg
    caption: >-
      "At Bala, Muskoka Lakes, Canada" — hand-tinted postcard looking out into Bala
      Bay from the train station, crowds watching from the north shore.
    credit: Rick Butler collection
  - file: /archives/1913/1913-postcard-north-shore-crowd.jpg
    caption: >-
      "At Bala, Muskoka Lakes, Canada" — a different postcard from the one above,
      same series and title but a different scene: spectators lined up along the
      north shore watching the regatta, canoes out on the bay.
    credit: Rick Butler collection
  - file: /archives/1913/1913-postcard-view-near-the-ark.jpg
    caption: >-
      View from the footbridge over the bay, crowds watching from the north shore
      and Cromarty Lodge in the background. The postcard's own printed title is
      "View near the Ark, Bala Road, on Lake Muskoka, Gravenhurst, Ont." — a
      generic commercial caption rather than one naming the regatta.
    credit: Rick Butler collection

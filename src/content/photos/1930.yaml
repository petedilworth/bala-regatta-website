year: 1930
items:
  - file: /archives/1930/1930-15-20hp-motorboat-pennant.jpg
    caption: >-
      1st-place pennant, 15-20 H.P. Motorboat, Bala Regatta, with the Bala Aquatic
      Association emblem. Winner not yet identified; year undated on the pennant
      itself.
    credit: Muskoka Heritage Centre
    event: 15-20hp-motorboat
  - file: /archives/1930/1930-windsor-park-motorboat-races.jpg
    caption: >-
      Motorboat races on the bay, seen from Windsor Park — a crowd gathered on shore,
      boats out on the water. Exact year unconfirmed, dated to 1930 alongside the
      other item on this page.
    credit: Rick Butler collection
  - file: /archives/1930/1930-powerboat-racing.jpg
    caption: >-
      Powerboat racing on the bay, watched by a large crowd along the shore. Exact
      year unconfirmed, dated to 1930 alongside the other items on this page.
    credit: Rick Butler collection

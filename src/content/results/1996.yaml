  - event: girls-16-under-quarter-mile-swim
    placings:
      - competitors:
          - name: "Heather Maciver"
        trophy: worth-trophy
  # Burt Trophy — as printed in the 1997 programme: "Neil Manchee"
  - event: boys-16-under-quarter-mile-swim
